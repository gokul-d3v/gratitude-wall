<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BROTIFY - Virtual Gratitude & Appreciation Wall</title>
    <meta name="description" content="BROTIFY is a real-time virtual gratitude wall where employees share appreciation notes, tag colleagues, and spread positivity across the organization." />
    <meta name="keywords" content="gratitude wall, employee appreciation, team recognition, workplace positivity, BROTIFY" />
    <meta name="author" content="BROTIFY" />
    <meta name="theme-color" content="#0f172a" />

    <script>
      try {
        const stored = localStorage.getItem('brotify-theme-storage');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed.state && parsed.state.theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BROTIFY - Virtual Gratitude & Appreciation Wall" />
    <meta property="og:description" content="A real-time virtual gratitude wall where employees share appreciation notes, tag colleagues, and spread positivity." />
    <meta property="og:url" content="/" />

    <!-- Google Fonts: Inter & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..900;1,300..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-[#fffcf9] dark:bg-[#0f172a] text-[#191c1d] dark:text-[#f8fafc] antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: 'Inter', sans-serif;">
        <h1>BROTIFY - Gratitude Wall</h1>
        <p>JavaScript is required to run this application. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
